# Neon Driver at /neon-driver/ (files uploaded by `npm run deploy` to /var/www/neon-driver).
# Goes inside the site's `server { ... }` block.

location = /neon-driver {
    return 301 /neon-driver/;
}

location /neon-driver/ {
    alias /var/www/neon-driver/;
    index index.html;

    # The page itself: always revalidated, so a deploy shows up on the next load
    location = /neon-driver/index.html {
        alias /var/www/neon-driver/index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed bundles (a new deploy gets new names): cache for good
    location /neon-driver/assets/ {
        alias /var/www/neon-driver/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Recordings: rarely change, not hashed
    location /neon-driver/audio/ {
        alias /var/www/neon-driver/audio/;
        types { audio/mp4 m4a; text/markdown md; }
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
