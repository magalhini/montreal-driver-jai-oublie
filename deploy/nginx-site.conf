# /etc/nginx/sites-available/magalhini: the droplet's main site, serving both games.
# Each game is configured in its own snippet (deploy/nginx-<game>.conf -> /etc/nginx/snippets/<game>.conf).
# Also the default server, so the bare IP shows the same thing.
# Certbot (`certbot --nginx -d magalhini.duckdns.org`) adds the HTTPS server block to this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name magalhini.duckdns.org _;

    # No landing page yet: the bare address goes to the newest game
    location = / {
        return 302 /montreal-driver/;
    }

    include snippets/montreal-driver.conf;
    include snippets/neon-driver.conf;
}
