# /etc/nginx/sites-available/neon-driver: the droplet's only site (replaces nginx's default page).
# The game itself is configured in the snippet (deploy/nginx-neon-driver.conf -> /etc/nginx/snippets/).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Nothing else lives here yet: the bare address goes to the game
    location = / {
        return 302 /neon-driver/;
    }

    include snippets/neon-driver.conf;
}
